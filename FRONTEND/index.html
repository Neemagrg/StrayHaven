<!DOCTYPE html>
<html>
<head>
  <title>Stray Haven - Rescue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🐾 Stray Haven - Rescue</h1>

<!-- Rescue Form -->
<h2>Report a Rescue</h2>
<form id="rescueForm">
  <input type="text" id="name" placeholder="Your Name" required><br>
  <input type="text" id="phone" placeholder="Phone" required><br>
  <input type="text" id="location" placeholder="Location" required><br>
  <textarea id="description" placeholder="Describe the situation"></textarea><br>
  <button type="submit">Submit</button>
</form>

<hr>

<!-- Events Display -->
<h2>Events & Campaigns</h2>
<div id="events"></div>

<hr>

<!-- Add Event -->
<h2>Add Event (Admin)</h2>
<form id="eventForm">
  <input type="text" id="title" placeholder="Event Title" required><br>
  <input type="date" id="date" required><br>

  <textarea id="desc" placeholder="Description"></textarea><br>
  <button type="submit">Add Event</button>
</form>

<script src="script.js"></script>

</body>
</html>
